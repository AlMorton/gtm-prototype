  <header class="site-header">
    <a class="brand" href="index.html">GTM Prototype</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="shop.html">Shop</a>
      <a href="cart.html" class="active">Cart (<span id="cart-count">0</span>)</a>
      <a href="login.html" id="account-link">Login</a>
    </nav>
  </header>

  <main>
    <section class="page-intro">
      <h1>Cart</h1>
      <p>Loading this page pushes <code>view_cart</code>; removing an item pushes <code>remove_from_cart</code>.</p>
    </section>

    <section>
      <p id="cart-empty" class="empty-state" hidden>Your cart is empty. <a href="shop.html">Go to the shop</a>.</p>
      <table id="cart-table" class="cart-table">
        <thead>
          <tr><th>Item</th><th>Qty</th><th>Total</th><th></th></tr>
        </thead>
        <tbody id="cart-items"></tbody>
        <tfoot>
          <tr><th colspan="2">Subtotal</th><th id="cart-total"></th><th></th></tr>
        </tfoot>
      </table>
      <p class="actions"><a href="checkout.html" id="checkout-button" class="btn">Proceed to checkout</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>GTM Prototype · built for testing</p>
  </footer>

  <script src="script.js"></script>
  <script src="shop.js"></script>
